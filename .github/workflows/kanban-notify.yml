name: Notificar cambio de estado (Kanban clásico con mención)

on:
  issues:
    types: [labeled, unlabeled]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar información
        run: echo "La issue ${{ github.event.issue.number }} cambió de etiqueta."

      - name: Comentar en la issue con mención
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            🔔 **@IsabelKyra**, esta tarea cambió su estado a **${{ github.event.label.name }}**.
            _(Notificación automática por movimiento en el tablero Kanban.)_
